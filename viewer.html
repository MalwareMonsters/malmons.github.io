<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Malmons Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @font-face {
      font-family: 'Terminal';
      src: url('./fonts/Terminal.woff') format('woff');
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #111;
      font-family: 'Terminal', monospace;
      color: white;
    }
    #container {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .overlay-top, .overlay-bottom {
      position: absolute;
      width: 100%;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }
    .overlay-top {
      top: 12px;
    }
    .overlay-bottom {
      bottom: 70px;
    }
    #logo-container img {
      height: 50px;
    }
    #logo-container h1 {
      margin: 10px 0 0;
      font-size: 28px;
    }
    #sponsor {
      font-size: 16px;
      color: #000;
      margin-top: 8px;
      pointer-events: auto;
    }
    #sponsor a {
      color: #1a73e8;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    #sponsor img {
      height: 22px;
    }
  </style>
</head>
<body>
  <div id="container">
    <iframe id="malmonFrame" allow="autoplay; fullscreen; vr" allowfullscreen></iframe>
    <div class="overlay-top" id="logo-container">
      <img src="./malmonslogo.png" alt="Malmons Logo">
      <h1 id="malmonTitle">Malmons</h1>
    </div>
    <div class="overlay-bottom">
      <div id="sponsor">
        Sponsored by
        <a href="http://malwarevillage.org" target="_blank">
          <img src="malware-village-logo.png" alt="Malware Village Logo" />
          Malware Village
        </a>
      </div>
    </div>
  </div>
  <script>
    const iframe = document.getElementById('malmonFrame');
    const title = document.getElementById('malmonTitle');
    const host = window.location.hostname.toLowerCase();

    const scenes = {
      "stuxnet": {
        src: "https://playcanv.as/p/1e100276/",
        title: "The Stuxnet Malmons"
      },
      "gh0st-rat": {
        src: "https://playcanv.as/b/3f3c389e",
        title: "The Gh0st RAT Malmons"
      },
      "flame": {
        src: "https://playcanv.as/b/f760a96f",
        title: "The Flame Malmons"
      }
    };

    let key = Object.keys(scenes).find(k => host.startsWith(k));
    if (!key) key = 'gh0st-rat';

    iframe.src = scenes[key].src;
    title.textContent = scenes[key].title;
  </script>
</body>
</html>
