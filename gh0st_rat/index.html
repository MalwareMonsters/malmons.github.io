<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gh0st RAT - Malmons</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @font-face {
      font-family: 'Terminal';
      src: url('../fonts/Terminal.woff') format('woff');
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #111;
      font-family: 'Terminal', monospace;
      color: white;
    }

    #container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .overlay {
      position: absolute;
      width: 100%;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }

    .top-overlay {
      top: 12px;
    }

    .bottom-overlay {
      bottom: 80px;
    }

    #logo-container img {
      height: 50px;
    }

    #logo-container h1 {
      margin: 10px 0 0;
      font-size: 28px;
    }

    #sponsor {
      font-size: 18px;
      color: #000;
      margin-top: 6px;
      pointer-events: auto;
    }

    #sponsor a {
      color: #1a73e8;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    #sponsor img {
      height: 22px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div id="container">
    <iframe src="https://playcanv.as/b/3f3c389e" allow="autoplay; fullscreen; vr" allowfullscreen></iframe>

    <div class="overlay top-overlay" id="logo-container">
      <img src="../assets/malmonslogo.png" alt="Malmons Logo">
      <h1>The Gh0st RAT Malmons</h1>
    </div>

    <div class="overlay bottom-overlay" id="sponsor">
      Sponsored by 
      <a href="https://malwarevillage.org" target="_blank">
        <img src="../assets/malware-village-logo.png" alt="Malware Village Logo"/>
        Malware Village
      </a>
    </div>
  </div>
</body>
</html>
