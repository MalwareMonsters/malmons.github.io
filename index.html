<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Malmons World</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @font-face {
      font-family: 'Terminal';
      src: url('./fonts/Terminal.woff') format('woff');
    }
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background-color: #727272;
      color: white;
      font-family: 'Terminal', monospace;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    img {
      max-width: 300px;
      margin-bottom: 40px;
    }
    select {
      font-family: 'Terminal', monospace;
      font-size: 18px;
      padding: 10px 20px;
      background-color: #111;
      color: white;
      border: 2px solid #888;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <img src="./malmonslogo.png" alt="Malmons Logo">
  <select id="malmonPicker">
    <option disabled selected>Pick a Malmons</option>
    <option value="http://stuxnet.malmons.world">Stuxnet</option>
    <option value="http://gh0st_rat.malmons.world">Gh0st RAT</option>
    <option value="http://flame.malmons.world">Flame</option>
  </select>
  <script>
    document.getElementById('malmonPicker').addEventListener('change', function () {
      window.location.href = this.value;
    });
  </script>
</body>
</html>
