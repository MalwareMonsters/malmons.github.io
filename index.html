<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Malmons World</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @font-face {
      font-family: 'Terminal';
      src: url('./fonts/Terminal.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #111;
      font-family: 'Terminal', monospace;
      color: white;
    }

    #container {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .overlay-top, .overlay-bottom {
      position: absolute;
      width: 100%;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }

    .overlay-top {
      top: 12px;
    }

    #logo-container img {
      height: 50px;
    }

    #logo-container h1 {
      margin: 10px 0 0 0;
      font-size: 28px;
      color: white;
    }

    .overlay-bottom {
      bottom: 70px; /* lifted up further above gray bar */
    }

    #scene-selector {
      margin-bottom: 12px;
      pointer-events: auto;
    }

    #scene-selector select {
      font-family: 'Terminal', monospace;
      font-size: 16px;
      padding: 6px 12px;
      background-color: #222;
      color: white;
      border: 1px solid #555;
      border-radius: 4px;
    }

    #sponsor {
      font-size: 16px;
      color: #000;
      margin-top: 6px;
      pointer-events: auto;
    }

    #sponsor a {
      color: #1a73e8;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    #sponsor img {
      height: 22px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div id="container">
    <iframe id="malmonFrame" allow="autoplay; fullscreen; vr" allowfullscreen></iframe>

    <!-- Top Overlay -->
    <div class="overlay-top" id="logo-container">
      <img src="malmonslogo.png" alt="Malmons Logo">
      <h1 id="malmonTitle">Malmons</h1>
    </div>

    <!-- Scene Selector & Sponsor (Bottom Overlay Grouped) -->
    <div class="overlay-bottom">
      <div id="scene-selector">
        <select id="sceneDropdown">
          <option value="gh0st_rat">Gh0st RAT</option>
          <option value="flame">Flame</option>
        </select>
      </div>
      <div id="sponsor">
        Sponsored by 
        <a href="https://malwarevillage.org" target="_blank">
          <img src="malware-village-logo.png" alt="Malware Village Logo"/>
          Malware Village
        </a>
      </div>
    </div>
  </div>

  <script>
    const iframe = document.getElementById('malmonFrame');
    const title = document.getElementById('malmonTitle');
    const dropdown = document.getElementById('sceneDropdown');

    const scenes = {
      gh0st_rat: {
        src: "https://playcanv.as/b/3f3c389e",
        title: "The Gh0st RAT Malmons"
      },
      flame: {
        src: "https://playcanv.as/b/458a3b3c",
        title: "The Flame Malmons"
      }
    };

    function loadScene(key) {
      iframe.src = scenes[key].src;
      title.textContent = scenes[key].title;
    }

    const initialPath = window.location.pathname.toLowerCase().replace('/', '');
    const initialScene = scenes[initialPath] ? initialPath : 'gh0st_rat';
    dropdown.value = initialScene;
    loadScene(initialScene);

    dropdown.addEventListener('change', () => {
      const selected = dropdown.value;
      history.replaceState({}, '', '/' + selected);
      loadScene(selected);
    });
  </script>
</body>
</html>
