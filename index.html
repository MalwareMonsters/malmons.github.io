<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Malmons World - Gh0st RAT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #111;
      font-family: Arial, sans-serif;
      color: white;
    }

    #container {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .overlay-top, .overlay-bottom {
      position: absolute;
      width: 100%;
      text-align: center;
      z-index: 10;
      pointer-events: none; /* allows clicking through to iframe */
    }

    .overlay-top {
      top: 12px;
    }


    #logo-container img {
      height: 50px;
    }

    #logo-container h1 {
      margin: 10px 0 0 0;
      font-size: 28px;
      color: white;
    }

    .overlay-bottom {
  position: absolute;
  bottom: 60px; /* lifted above PlayCanvas bar */
  width: 100%;
  text-align: center;
  z-index: 10;
  pointer-events: none;
}

#sponsor {
  font-size: 14px;
  color: #000; /* black text */
}

#sponsor a {
  color: #1a73e8;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  pointer-events: auto;
}

#sponsor img {
  height: 20px;
  vertical-align: middle;
}

  </style>
</head>
<body>

  <div id="container">
    <iframe 
      src="https://playcanv.as/p/mfwUITNf/" 
      allow="autoplay; fullscreen; vr"
      allowfullscreen>
    </iframe>

    <!-- Top Overlay -->
    <div class="overlay-top" id="logo-container">
      <img src="malmonslogo.png" alt="Malmons Logo">
      <h1>The Gh0st RAT Malmons</h1>
    </div>

    <!-- Bottom Overlay -->
    <div class="overlay-bottom" id="sponsor">
      Sponsored by 
      <a href="https://malwarevillage.org" target="_blank">
        <img src="malware-village-logo.png" alt="Malware Village Logo"/>
        Malware Village
      </a>
    </div>
  </div>

</body>
</html>
