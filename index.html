<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Malmons World</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @font-face {
      font-family: 'Terminal';
      src: url('./fonts/Terminal.woff') format('woff');
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #222;
      font-family: 'Terminal', monospace;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    img {
      height: 100px;
      margin-bottom: 20px;
    }

    select {
      font-family: 'Terminal', monospace;
      font-size: 18px;
      padding: 10px 20px;
      background-color: #333;
      color: white;
      border: 1px solid #666;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <img src="./assets/malmonslogo.png" alt="Malmons Logo">
  <select onchange="handleSelect(this.value)">
    <option disabled selected>Pick a Malmons</option>
    <option value="/gh0st_rat/">Gh0st RAT</option>
    <option value="/flame/">Flame</option>
    <option value="/stuxnet/">Stuxnet</option>
  </select>

  <script>
    function handleSelect(path) {
      window.location.href = path;
    }
  </script>
</body>
</html>
